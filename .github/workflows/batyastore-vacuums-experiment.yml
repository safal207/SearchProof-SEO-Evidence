name: SearchProof BatyaStore Vacuums Experiment

on:
  push:
    branches:
      - audit/batyastore-vacuums-experiment-2026-08-11

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout SearchProof
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Crawl vertical vacuums category
        run: npm run crawl -- "https://batyastore.ru/catalog/bytovaya-tekhnika/pylesosy/vertikalnye-pylesosy/" --max-pages=30 --max-depth=1

      - name: Probe category variants and representative products
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import { crawlSite } from './src/crawler.mjs';

          const targets = [
            'https://batyastore.ru/catalog/bytovaya-tekhnika/pylesosy/vertikalnye-pylesosy/',
            'https://batyastore.ru/catalog/bytovaya-tekhnika/pylesosy/vertikalnye-pylesosy/?sort=NAME&order=asc',
            'https://batyastore.ru/catalog/bytovaya-tekhnika/pylesosy/vertikalnye-pylesosy/?display=list',
            'https://batyastore.ru/catalog/bytovaya-tekhnika/pylesosy/vertikalnye-pylesosy/?PAGEN_1=2',
            'https://batyastore.ru/catalog/bytovaya-tekhnika/pylesosy/vertikalnye-pylesosy/vertikalnyy_pylesos_amica_joran_vm9001/',
            'https://batyastore.ru/catalog/bytovaya-tekhnika/pylesosy/vertikalnye-pylesosy/pylesos_miele_soml0_triflex_hx2_pro_seryy_infiniti/',
            'https://batyastore.ru/catalog/bytovaya-tekhnika/pylesosy/vertikalnye-pylesosy/besprovodnoy_pylesos_electrolux_clean_600_pure_es62cb25dh/'
          ];

          const evidence = [];
          for (const target of targets) {
            const report = await crawlSite({ startUrl: target, maxPages: 1, maxDepth: 0, timeoutMs: 15000 });
            const page = report.pages[0] || {};
            evidence.push({
              requested: target,
              finalUrl: page.url || '',
              status: page.status || 0,
              title: page.title || '',
              h1: page.h1s?.[0] || '',
              description: page.description || '',
              canonical: page.canonical || '',
              sitemapContainsLogicalPage: report.sitemap.urls.includes(page.canonical || page.url || target),
              findings: report.findings.map((finding) => finding.id)
            });
          }
          fs.mkdirSync('reports', { recursive: true });
          fs.writeFileSync('reports/batyastore-vacuums-targeted.json', JSON.stringify(evidence, null, 2));
          console.log(JSON.stringify(evidence, null, 2));
          NODE

      - name: Build category summary
        env:
          SEARCHPROOF_MODE: site
          SEARCHPROOF_TARGET: https://batyastore.ru/catalog/bytovaya-tekhnika/pylesosy/vertikalnye-pylesosy/
        run: node scripts/github-summary.mjs

      - name: Upload experiment evidence
        uses: actions/upload-artifact@v4
        with:
          name: searchproof-batyastore-vacuums-${{ github.run_id }}
          path: |
            reports/*.json
            reports/github-summary.md
          if-no-files-found: error
          retention-days: 14
